<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Telecom Fault Tracker</title>
    <meta name="description" content="Login to the telecom fault tracker dashboard.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-dark: #080c14;
            --bg-card: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent-cyan: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: radial-gradient(at 0% 0%, rgba(99,102,241,0.12), transparent 45%), radial-gradient(at 100% 100%, rgba(6,182,212,0.10), transparent 40%), var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
        }

        .login-shell {
            width: min(100%, 460px);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }

        .login-header {
            padding: 2rem 2rem 1rem;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(6,182,212,0.08));
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.02em;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
            box-shadow: 0 0 18px var(--primary-glow);
        }

        .login-body {
            padding: 2rem;
        }

        .eyebrow {
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent-cyan);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: -0.03em;
            margin-bottom: 0.35rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        form {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 0.8rem 0.9rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
        }

        .btn {
            border: 1px solid rgba(99, 102, 241, 0.5);
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: #fff;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .login-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.2rem;
        }

        .login-actions > * {
            flex: 1;
        }

        .helper {
            text-align: center;
            margin-top: 1.1rem;
            color: var(--text-muted);
            font-size: 0.84rem;
        }

        .helper a {
            color: #a5b4fc;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="login-shell">
        <div class="login-header">
            <div class="brand">
                <div class="brand-icon"><i class="fa-solid fa-tower-cell"></i></div>
                <span>Telecom Fault Tracker</span>
            </div>
        </div>

        <div class="login-body">
            <div class="eyebrow">Welcome back</div>
            <h1>Login</h1>
            <p class="subtitle">Access the telecom network dashboard, monitor outages, and review customer risk alerts.</p>

            <form id="loginForm">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="name@telecom.com">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Enter password">
                </div>

                <div class="login-actions">
                    <button type="submit" class="btn">Login</button>
                    <a href="register.html" class="btn btn-secondary">Register</a>
                </div>
            </form>

            <p class="helper">No account yet? <a href="register.html">Create one here</a></p>
        </div>
    </main>

    <script>
        const loginForm = document.getElementById('loginForm');

        loginForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            let customer = null;
            try {
                customer = JSON.parse(localStorage.getItem('telecom_customer_profile') || 'null');
            } catch (error) {
                customer = null;
            }

            const isValidDemoLogin = email === 'demo@telecom.com' && password === 'demo123';
            const isValidSavedLogin = customer && customer.email && customer.email.toLowerCase() === email.toLowerCase() && customer.password === password;

            if (!isValidDemoLogin && !isValidSavedLogin) {
                alert('Incorrect email or password. Please enter the correct credentials to login.');
                return;
            }

            sessionStorage.setItem('telecom_registered', 'true');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
