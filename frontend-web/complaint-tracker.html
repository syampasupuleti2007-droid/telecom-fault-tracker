<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Tracker | Telecom Fault Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-dark: #080c14;
            --bg-card: rgba(17, 24, 39, 0.82);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-soft: rgba(99, 102, 241, 0.18);
            --accent-cyan: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.10) 0px, transparent 50%),
                var(--bg-dark);
            color: var(--text-main);
        }

        .page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .nav-btn {
            text-decoration: none;
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: white;
            padding: 0.8rem 1.1rem;
            border-radius: 10px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.22);
        }

        .header-card {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 1.5rem 1.8rem;
            margin-bottom: 1.5rem;
        }

        .search-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 0.9rem 1rem;
            margin-bottom: 1.5rem;
        }

        .search-card i { color: var(--accent-cyan); }

        .search-input {
            flex: 1;
            min-width: 0;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 9px;
            padding: 0.7rem 0.85rem;
            color: var(--text-main);
            font: inherit;
            outline: none;
        }

        .search-input:focus { border-color: var(--accent-cyan); }

        .search-hint { color: var(--text-muted); font-size: 0.78rem; }

        h1 {
            font-size: clamp(2.2rem, 4vw, 3.4rem);
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.2rem 1.25rem;
        }

        .stat-label {
            font-size: 0.76rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem 1.1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: rgba(15, 23, 42, 0.7);
            color: var(--text-muted);
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        td {
            color: var(--text-main);
        }

        .badge {
            display: inline-block;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            font-size: 0.73rem;
            font-weight: 700;
        }

        .empty-state {
            padding: 1.25rem;
            color: var(--text-muted);
            text-align: center;
        }

        .open { background: rgba(239, 68, 68, 0.14); color: #fca5a5; }
        .in_progress { background: rgba(245, 158, 11, 0.14); color: #fcd34d; }
        .resolved { background: rgba(16, 185, 129, 0.14); color: #a7f3d0; }

        .severity {
            display: inline-block;
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .low { background: rgba(16, 185, 129, 0.12); color: #86efac; }
        .medium { background: rgba(245, 158, 11, 0.12); color: #fbbf24; }
        .high { background: rgba(239, 68, 68, 0.12); color: #fca5a5; }
        .critical { background: rgba(239, 68, 68, 0.2); color: #fecaca; }

        @media (max-width: 768px) {
            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            table { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a class="nav-btn" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div class="header-card">
            <h1>Complaint Tracker</h1>
            <div class="subtitle">Monitor subscriber issues, severity, and current resolution status.</div>
        </div>

        <div class="search-card">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="complaintSearchInput" class="search-input" type="search" placeholder="Search customer name, email, ID, complaint, category, or status" aria-label="Search complaints by customer">
            <span class="search-hint">Customer-linked search</span>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Total Complaints</div>
                <div class="stat-value" id="totalComplaintsValue">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Open</div>
                <div class="stat-value" id="openComplaintsValue" style="color: var(--danger);">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">In Progress</div>
                <div class="stat-value" id="progressComplaintsValue" style="color: var(--warning);">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Resolved</div>
                <div class="stat-value" id="resolvedComplaintsValue" style="color: var(--success);">0</div>
            </div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Subscriber</th>
                        <th>Tower</th>
                        <th>Category</th>
                        <th>Severity</th>
                        <th>Status</th>
                        <th>Logged At</th>
                    </tr>
                </thead>
                <tbody id="complaintTrackerBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "telecom_complaints";
        const subscriberStorageKey = "telecom_subscribers";
        const API_BASE_URL = "http://localhost:8080/api";
        const defaultSubscribers = [
            { subscriberId: 1, name: "Ava Morgan", email: "ava.morgan@telecom.example.com", phone: "+15550001001" },
            { subscriberId: 2, name: "Noah Bennett", email: "noah.bennett@telecom.example.com", phone: "+15550001002" },
            { subscriberId: 3, name: "Mia Patel", email: "mia.patel@telecom.example.com", phone: "+15550001003" },
            { subscriberId: 5, name: "Sofia Kim", email: "sofia.kim@telecom.example.com", phone: "+15550001005" },
            { subscriberId: 7, name: "Isabella Diaz", email: "isabella.diaz@telecom.example.com", phone: "+15550001007" },
            { subscriberId: 9, name: "Emma Watson", email: "emma.watson@telecom.example.com", phone: "+15550001009" }
        ];
        const storedSubscribers = getStoredValue(subscriberStorageKey);
        let trackerSubscribers = storedSubscribers.length ? storedSubscribers : defaultSubscribers;
        let trackerComplaints = [];

        const defaultComplaints = [
            { complaintId: 1, subscriberId: 2, towerId: 3, category: "network_fault", description: "Repeated dropped calls near East Market tower.", severity: "high", status: "open", loggedAt: "2026-09-26 09:15:00" },
            { complaintId: 2, subscriberId: 3, towerId: 3, category: "network_fault", description: "Intermittent service and slow data around East Market.", severity: "critical", status: "in_progress", loggedAt: "2026-09-26 09:40:00" },
            { complaintId: 3, subscriberId: 5, towerId: 3, category: "call_drops", description: "Calls disconnect several times each day.", severity: "high", status: "open", loggedAt: "2026-09-26 10:05:00" },
            { complaintId: 4, subscriberId: 7, towerId: 3, category: "network_fault", description: "No reliable signal during evening commute.", severity: "medium", status: "open", loggedAt: "2026-09-26 10:20:00" },
            { complaintId: 5, subscriberId: 1, towerId: 2, category: "billing", description: "Question about international usage charge.", severity: "low", status: "resolved", loggedAt: "2026-09-25 14:10:00" },
            { complaintId: 6, subscriberId: 9, towerId: 7, category: "network_fault", description: "Complete outage in Metro Station area.", severity: "critical", status: "open", loggedAt: "2026-09-26 10:45:00" }
        ];

        function getStoredValue(key) {
            try {
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : [];
            } catch {
                return [];
            }
        }

        function getSubscriberById(id) {
            return trackerSubscribers.find(s => Number(s.subscriberId) === Number(id)) || null;
        }

        function getTowerName(id) {
            const towerMap = {
                1: "Central Exchange",
                2: "North Ridge",
                3: "East Market",
                4: "South Point",
                5: "West Park",
                6: "Harbor View",
                7: "Metro Station",
                8: "Tech Hub"
            };
            return towerMap[id] || `Tower #${id}`;
        }

        function formatCategory(value) {
            return String(value || "General").replace(/_/g, " ").replace(/\b\w/g, ch => ch.toUpperCase());
        }

        function renderComplaintTracker() {
            const complaints = getStoredValue(STORAGE_KEY);
            const safeComplaints = complaints.length ? complaints : defaultComplaints;
            trackerComplaints = safeComplaints;

            const total = safeComplaints.length;
            const open = safeComplaints.filter(c => c.status === "open").length;
            const progress = safeComplaints.filter(c => c.status === "in_progress").length;
            const resolved = safeComplaints.filter(c => c.status === "resolved").length;

            document.getElementById("totalComplaintsValue").textContent = total;
            document.getElementById("openComplaintsValue").textContent = open;
            document.getElementById("progressComplaintsValue").textContent = progress;
            document.getElementById("resolvedComplaintsValue").textContent = resolved;

            const tbody = document.getElementById("complaintTrackerBody");
            if (!tbody) return;

            if (!safeComplaints.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No complaints recorded yet.</td></tr>';
                return;
            }

            const query = String(document.getElementById("complaintSearchInput")?.value || "").trim().toLowerCase();
            const filteredComplaints = safeComplaints.filter(c => {
                const subscriber = getSubscriberById(c.subscriberId);
                return [
                    c.complaintId, c.subscriberId, c.description, c.category, c.severity, c.status,
                    subscriber?.name, subscriber?.email, subscriber?.phone
                ].some(value => String(value || "").toLowerCase().includes(query));
            });

            if (!filteredComplaints.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No complaints match this search.</td></tr>';
                return;
            }

            tbody.innerHTML = filteredComplaints.map(c => {
                const subscriber = getSubscriberById(c.subscriberId);
                const severityClass = String(c.severity || "medium").toLowerCase();
                const statusClass = String(c.status || "open").replace(/\s+/g, "_").toLowerCase();
                const statusLabel = statusClass === "in_progress" ? "In Progress" : statusClass === "resolved" ? "Resolved" : "Open";

                return `
                    <tr>
                        <td>#${c.complaintId}</td>
                        <td>${subscriber ? subscriber.name : `Sub #${c.subscriberId}`}</td>
                        <td>${getTowerName(c.towerId)}</td>
                        <td>${formatCategory(c.category)}</td>
                        <td><span class="severity ${severityClass}">${String(c.severity || "Medium").toUpperCase()}</span></td>
                        <td><span class="badge ${statusClass}">${statusLabel}</span></td>
                        <td>${new Date(c.loggedAt || Date.now()).toLocaleString()}</td>
                    </tr>
                `;
            }).join("");
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("complaintSearchInput")?.addEventListener("input", renderComplaintTracker);
            renderComplaintTracker();

            Promise.all([
                fetch(`${API_BASE_URL}/subscribers`).then(response => response.ok ? response.json() : null),
                fetch(`${API_BASE_URL}/complaints`).then(response => response.ok ? response.json() : null)
            ]).then(([subscribers, complaints]) => {
                if (Array.isArray(subscribers) && subscribers.length) {
                    trackerSubscribers = subscribers;
                    localStorage.setItem(subscriberStorageKey, JSON.stringify(subscribers));
                }
                if (Array.isArray(complaints) && complaints.length) {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(complaints));
                }
                renderComplaintTracker();
            }).catch(() => {});
        });
        window.addEventListener("storage", renderComplaintTracker);
    </script>
</body>
</html>
